{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{- if eq .Section "blog" }}
  <p class="meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    · {{ .ReadingTime }} min read
  </p>
  {{- end }}
  {{ .Content }}
</article>
{{- if eq .Section "blog" }}
<p class="back"><a href="{{ "blog/" | relURL }}">← All posts</a></p>
{{- end }}
{{ end }}
